[project]
name = "clickup-slack-agent"
version = "0.1.0"
description = "Slack-native ClickUp assistant: scheduled digests plus an LLM tool-calling agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20",
    "anthropic>=0.40",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=2.22.0",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clickup_slack_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
