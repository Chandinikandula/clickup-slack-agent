# Fly.io config. Secrets are not here — set them with:
#   fly secrets set SLACK_BOT_TOKEN=... SLACK_APP_TOKEN=... CLICKUP_API_TOKEN=...
#
# There is no [http_service] block on purpose: Socket Mode dials out to
# Slack, so the app needs no public address, no TLS certificate and no
# inbound port. It also means Fly never idles the machine to zero, which
# matters — a stopped machine misses the 09:30 digest.

app = "clickup-slack-agent"
primary_region = "sin" # Singapore — nearest region to Asia/Kolkata

[build]

[env]
TIMEZONE = "Asia/Kolkata"
DIGEST_HOUR = "9"
DIGEST_MINUTE = "30"
LLM_PROVIDER = "gemini"
LLM_MODEL = "gemini-3.5-flash"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
cpus = 1
